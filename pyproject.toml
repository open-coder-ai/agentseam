[build-system]
# >=77 is required, not preferred: the PEP 639 `license = "Apache-2.0"` expression below
# is only understood from 77 onward. 68 built correctly only because CI happened to
# resolve a newer setuptools; a build pinned at the declared floor would not.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentseam"
version = "0.2.0"
description = "The primitives layer for every coding agent — one handler API over per-agent hooks, instruction files, plugin packaging, and config."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 SPDX expression; needs setuptools >= 77 (pinned in build-system above).
# The `{ text = ... }` table form this replaces is deprecated and emits the legacy
# `License:` field; the expression emits `License-Expression`, which is what a tool
# reading the licence programmatically now looks for. Changed before the first
# publish on purpose -- PyPI freezes a version's metadata permanently.
license = "Apache-2.0"
keywords = [
  "ai-agents", "hooks", "claude-code", "cursor", "copilot", "codex", "gemini-cli", "windsurf",
  "pretooluse", "agents-md", "plugin-packaging", "guardrails", "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # No License classifier: PyPI rejects one alongside a PEP 639 expression.
  "Operating System :: OS Independent",
  # requires-python is >=3.9; CI exercises the ends and the middle (3.9, 3.11, 3.13).
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []                      # stdlib only, on purpose: adapters must stay vendorable

[project.urls]
Homepage = "https://github.com/open-coder-ai/agentseam"
Source = "https://github.com/open-coder-ai/agentseam"
Documentation = "https://github.com/open-coder-ai/agentseam/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/open-coder-ai/agentseam/issues"
Changelog = "https://github.com/open-coder-ai/agentseam/blob/main/CHANGELOG.md"

[project.scripts]
agentseam = "agentseam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendor tables live in data/*.json and are read at import time. Without this the
# wheel ships without them and every import raises FileNotFoundError from a pip install
# while working perfectly from a source checkout -- the failure chock#87 caught on itself.
agentseam = ["data/*.json", "data/vendors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Layout is governed by `ruff format`; long diagnostic strings are allowed.
ignore = ["E501"]
