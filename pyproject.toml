[build-system]
# >=77 is required, not preferred: the PEP 639 `license = "Apache-2.0"` expression below
# is only understood from 77 onward. 68 built correctly only because CI happened to
# resolve a newer setuptools; a build pinned at the declared floor would not.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentseam"
version = "0.2.0"
description = "The primitives layer for every coding agent — one handler API over per-agent hooks, instruction files, plugin packaging, and config."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 SPDX expression; needs setuptools >= 77 (pinned in build-system above).
# The `{ text = ... }` table form this replaces is deprecated and emits the legacy
# `License:` field; the expression emits `License-Expression`, which is what a tool
# reading the licence programmatically now looks for. Changed before the first
# publish on purpose -- PyPI freezes a version's metadata permanently.
license = "Apache-2.0"
keywords = [
  "ai-agents", "hooks", "claude-code", "cursor", "copilot", "codex", "gemini-cli", "windsurf",
  "pretooluse", "agents-md", "plugin-packaging", "guardrails", "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # No License classifier: PyPI rejects one alongside a PEP 639 expression.
  "Operating System :: OS Independent",
  # requires-python is >=3.9; CI exercises the ends and the middle (3.9, 3.11, 3.13).
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []                      # stdlib only, on purpose: adapters must stay vendorable

[project.urls]
Homepage = "https://github.com/open-coder-ai/agentseam"
Source = "https://github.com/open-coder-ai/agentseam"
Documentation = "https://github.com/open-coder-ai/agentseam/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/open-coder-ai/agentseam/issues"
Changelog = "https://github.com/open-coder-ai/agentseam/blob/main/CHANGELOG.md"

[project.scripts]
agentseam = "agentseam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendor tables live in data/*.json and are read at import time. Without this the
# wheel ships without them and every import raises FileNotFoundError from a pip install
# while working perfectly from a source checkout -- the failure chock#87 caught on itself.
agentseam = ["data/*.json", "data/vendors/*.json", "data/templates/*.py.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["*.md"]
# Bundle templates are valid Python as-is (__TOKEN__ placeholders are identifiers), so
# they are linted as Python rather than shipped as unreadable string literals.
extend-include = ["*.py.tmpl"]

[tool.ruff.lint]
# The Sonar/Checkstyle/FindBugs bar (owner standard, plan/coding-standards.md §3), plus the
# base E/F/W/I already enforced: magic values, naming/shadowing/boolean-trap hygiene,
# FindBugs-style correctness and security, dead code, and CLI `print` discipline.
select = ["E", "F", "W", "I", "C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE", "FBT", "A", "B", "S", "BLE", "TRY", "RUF"]
# Layout is governed by `ruff format`; long diagnostic strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
# Template text is frozen -- a regenerated bundle must stay byte-identical -- so the
# formatter must not rewrap it; `ruff check` still lints the templates as Python.
exclude = ["*.py.tmpl"]

[tool.ruff.lint.per-file-ignores]
# A template references names the bundler splices in from other sections (Decision, sys,
# parse, ...) and its own __TOKEN__ placeholders; undefined-name analysis cannot see
# across the splice. The template is also frozen -- bundle-equivalence goldens require it
# stay byte-identical -- so its `exit` param (shadows the builtin, and is a boolean default
# positional arg mirroring dispatch.run()) and its catch-all parse guard are lint-exempt
# rather than rewritten.
"src/agentseam/data/templates/*.py.tmpl" = ["F821", "A002", "FBT002", "BLE001"]
# The CLI is agentseam's one designated output surface (coding-standards.md §3): every
# print() here is user-facing terminal output, not a debug leftover.
"src/agentseam/cli.py" = ["T201"]
# Event/Decision are plain value objects: every field beyond the first two is optional and
# keyword-only. install()/installed() mirror the same optional-config-knobs shape. Splitting
# either into a builder/options object would ripple through every adapter and CLI call site
# for no behavioral gain -- FindBugs and pylint both special-case exactly this "DTO
# constructor" / "config-knobs function" shape. install()/installed() take theirs positionally
# (none are keyword-only), so newer ruff's PLR0917 (positional-argument count; not in this
# wave's pinned ruff, live in CI's .github/requirements/lint.txt pin) flags them alongside
# PLR0913 for the same shape -- same reasoning, same ignore.
"src/agentseam/contract.py" = ["PLR0913"]
"src/agentseam/install.py" = ["PLR0913", "PLR0917"]
"src/agentseam/install_identity.py" = ["PLR0913", "PLR0917"]
# TODO(lint-adoption): this wave's Sonar/Checkstyle/FindBugs baseline (coding-standards.md
# §3) was measured and fixed for src/ only -- 100 findings at 2026-09-02, enumerated in
# plan/spine-a/reports/w51.md. tests/, tools/, examples/ and docs/'s two asset scripts were
# never measured against the new rule set and are out of scope for this wave; a follow-up
# wave should measure and adopt them on their own, since test/tooling code has legitimately
# different conventions (fixture subprocess calls, short import aliases, literal-heavy
# assertions) that the src/ baseline above does not speak to.
"tests/**" = ["C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE", "FBT", "A", "B", "S", "BLE", "TRY", "RUF"]
"tools/**" = ["C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE", "FBT", "A", "B", "S", "BLE", "TRY", "RUF"]
"examples/**" = ["C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE", "FBT", "A", "B", "S", "BLE", "TRY", "RUF"]
"docs/**" = ["C90", "N", "PLR", "PLW", "PLC", "ERA", "T20", "ARG", "RET", "SIM", "PIE", "FBT", "A", "B", "S", "BLE", "TRY", "RUF"]
