[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentseam"
version = "0.1.0"
description = "The primitives layer for every coding agent — one handler API over per-agent hooks, instruction files, plugin packaging, and config."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = [
  "ai-agents", "hooks", "claude-code", "cursor", "copilot", "codex", "gemini-cli", "windsurf",
  "pretooluse", "agents-md", "plugin-packaging", "guardrails", "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []                      # stdlib only, on purpose: adapters must stay vendorable

[project.urls]
Homepage = "https://github.com/open-coder-ai/agentseam"
Source = "https://github.com/open-coder-ai/agentseam"
Documentation = "https://github.com/open-coder-ai/agentseam/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/open-coder-ai/agentseam/issues"
Changelog = "https://github.com/open-coder-ai/agentseam/blob/main/CHANGELOG.md"

[project.scripts]
agentseam = "agentseam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Layout is governed by `ruff format`; long diagnostic strings are allowed.
ignore = ["E501"]
