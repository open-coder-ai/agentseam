version: 2

# The runtime dependency surface here is zero by design (stdlib only), so the only
# things to watch are dev tooling and the actions themselves.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A one-week cooldown before adopting a fresh release is the xz-class counter:
    # a poisoned version is usually caught within days, and nothing here needs a
    # dependency the hour it ships. Security advisories bypass this via alerts.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]

  # Workflow actions run with repository credentials; a stale action version is a
  # larger supply-chain risk here than any library bump.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      # All action bumps in one weekly PR: same kind of change (a SHA pin moving to
      # the current release tag), and one reviewable batch beats a PR stream.
      actions:
        patterns: ["*"]
