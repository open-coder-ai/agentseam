name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Workflow files are code with credentials attached; zizmor audits them for the
  # known-dangerous patterns (untrusted checkout, template injection, over-broad tokens).
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Run zizmor directly rather than via its action: the action uploads SARIF to
      # GitHub Advanced Security, which a private repository does not have, so the
      # job failed on the upload even when the scan itself found nothing. zizmor
      # exits non-zero on findings on its own, which is the signal we actually want.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
      - name: Run zizmor
        run: |
          pip install --require-hashes -r .github/requirements/zizmor.txt
          # --offline: zizmor's online audits call the GitHub API to check whether an
          # action tag has moved, which needs a token and can fail the job for a
          # network reason rather than a security one. Every action here is already
          # SHA-pinned and watched weekly by dependabot, so the offline audits are
          # the ones carrying real signal for this repo.
          zizmor --offline --format plain .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Built from a tagged module rather than the upstream install script, which
      # is fetched from a moving branch and piped straight into a shell: whoever
      # can write that branch runs code in this job. `go install` resolves through
      # the module proxy and verifies the download against sum.golang.org, so the
      # version below is what actually gets built.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.25"
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
      - name: Semgrep with the project rules
        run: |
          pip install --require-hashes -r .github/requirements/semgrep.txt
          semgrep --config .semgrep/agentseam.yml --error --quiet src/ tests/
