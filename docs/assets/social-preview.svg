  <circle cx="1062" cy="57.5" r="3.2" fill="#D9B45C"/>
  <text x="1074" y="62" font-family="Geist Mono" font-size="11" letter-spacing="0.2" fill="#D9B45C">v0.2.1 · APACHE-2.0</text>
  <line x1="48" y1="92" x2="1232" y2="92" stroke="#D9B45C" stroke-opacity="0.13" stroke-width="1"/>
  <text x="48" y="140" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">— THE PRIMITIVES LAYER</text>
  <text x="48" y="190" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#E8EEF6">One handler API for</text>
  <text x="48" y="230" font-family="Geist Mono" font-size="33" font-weight="700" letter-spacing="-1.2" fill="#D9B45C">every coding agent.</text>
  <text x="48" y="276" font-family="Geist Mono" font-size="13" fill="#9FB0C4">Every agent invented its own hook system —</text>
  <text x="48" y="298" font-family="Geist Mono" font-size="13" fill="#9FB0C4">different events, payloads, ways to say no.</text>
  <text x="48" y="320" font-family="Geist Mono" font-size="13" fill="#9FB0C4">agentseam is the layer underneath.</text>
  <text x="48" y="372" font-family="Geist Mono" font-size="10.5" letter-spacing="3.4" fill="#8A7340">THE WHOLE API</text>
  <rect x="48" y="386" width="410" height="72" rx="9" fill="#111E33" stroke="#D9B45C" stroke-opacity="0.16"/>
  <text x="66" y="412" font-family="Geist Mono" font-size="12.5" fill="#9FB0C4">from agentseam import run, Decision</text>
  <text x="66" y="436" font-family="Geist Mono" font-size="12.5" fill="#D9B45C">run(handler)</text>
  <text x="48" y="498" font-family="Geist Mono" font-size="10.5" letter-spacing="1.55" fill="#8A7340">DEGRADES HONESTLY — CLAIMS NEVER EXCEED THE MATRIX</text>
