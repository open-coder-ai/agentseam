<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-label="agentseam — the primitives layer for every coding agent: one handler API over per-agent hooks, instruction files, plugin packaging, and config. 12 adapters (claude_code, antigravity, codex_cli, cursor, devin, gemini_cli, grok, junie, kimi_code, tabnine, vscode_copilot, windsurf); 12 normalized events (pre_tool, post_tool, tool_failure, prompt_submit, session_start, session_end, subagent_start, subagent_stop, instructions_loaded, file_changed, pre_compact, stop); 6 decision outcomes (allow, deny, escalate, transform, warn, vouch); and the 5 honest enforcement levels a consumer may claim (enforced, enforceable, best-effort, detect, none). 16 agents in the capability matrix, 12 adapted, zero dependencies, Apache-2.0, version 0.2.1.">
